{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block body_class %}template-homepage{% endblock %}

{% block content %}
<section class="space-y-6">
  <div class="rounded-xl bg-sky-900 px-6 py-10 text-white shadow-sm">
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">{{ page.title }}</h1>
    {% if page.hero_text %}
    <p class="mt-3 max-w-2xl text-lg text-sky-100">{{ page.hero_text }}</p>
    {% endif %}
  </div>

  {% if page.intro %}
  <section class="prose prose-slate max-w-none rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    {{ page.intro|richtext }}
  </section>
  {% endif %}
</section>
{% endblock %}
